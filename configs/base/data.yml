# train: WDSV2MTrainDatasetRaw DataLoader workers run FK, then encode the 491-d rep

train_dataset: flowhmr/datasets/v2m_generation/train_dataset_raw.WDSV2MTrainDatasetRaw
train_dataset_args:
  # Your WebDataset shards: one brace pattern per dataset.
  # Shard/sample format: docs/resources.md#webdataset-shards-base-training
  tar_urls:
    - "/path/to/webdataset/mydata/mydata-{00000..00025}.tar"
    # - "/path/to/webdataset/<dataset>/<dataset>-{00000..000NN}.tar"
  augmentation_type: "original"
  cfg_dropout_prob: 0.1
  max_len: 360
  split: train
  load_hand: True
  shuffle_buffer: 2000
  resampled: true
  split_by_node: false
