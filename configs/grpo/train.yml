trainer_note: train_v2m.py merge order model -> data -> train; trainer model yml
train:
  max_epoch: 8
  batch_size: 4
  batch_size_val: 1
  lr: 2.5e-06
  num_workers: 2
  train_iterations: 2500
  grad_clip:
    max_norm: 1.0
    norm_type: 2
  scheduler: cosine_annealing
  scheduler_cfg:
    eta_min: 2.5e-07
  disable_tqdm: true
sampler_seed: 42
save_interval: 1
skip_log_zero_epoch: false
